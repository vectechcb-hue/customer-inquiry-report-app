<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>連線 Outlook</title>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;padding:24px">
<div id="msg">正在準備 Microsoft Outlook 登入…</div>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script>
(async function(){
  const CLIENT_ID="3b26a125-74f9-4ee5-a412-0a175899b7b2";
  const AUTHORITY="https://login.microsoftonline.com/consumers";
  const SCOPES=["User.Read","Mail.Read"];
  const REDIRECT=location.origin+location.pathname.replace(/login\.html$/,"");
  const msg=document.getElementById("msg");
  try{
    if(!window.msal) throw new Error("Microsoft 登入元件載入失敗");
    const app=new msal.PublicClientApplication({
      auth:{clientId:CLIENT_ID,authority:AUTHORITY,redirectUri:REDIRECT},
      cache:{cacheLocation:"localStorage"}
    });
    await app.initialize();
    const result=await app.handleRedirectPromise();
    if(result && result.account){
      app.setActiveAccount(result.account);
      msg.textContent="登入成功，正在回到 App…";
      location.replace(REDIRECT+"?auth=1");
      return;
    }
    const account=app.getActiveAccount()||app.getAllAccounts()[0];
    if(account){
      app.setActiveAccount(account);
      msg.textContent="已登入，正在回到 App…";
      location.replace(REDIRECT+"?auth=1");
      return;
    }
    msg.textContent="正在跳轉到 Microsoft 登入頁面…";
    await app.loginRedirect({scopes:SCOPES,prompt:"select_account",redirectUri:REDIRECT});
  }catch(e){
    console.error(e);
    msg.textContent="登入失敗："+e.message;
  }
})();
</script>
</body></html>
